[project]
name = "mailagent"
version = "0.1.0"
description = "A small, safety-conscious Gmail CLI for agent and human use"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "William Patton" }]
dependencies = [
    "click>=8.1",
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
    "requests>=2.32",
]

[project.scripts]
mailagent = "mailagent.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
